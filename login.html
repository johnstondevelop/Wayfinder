<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · LovinglyLost</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#5C2135">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LovinglyLost">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,500&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="app-style.css">
<link rel="stylesheet" href="site-nav.css">
<link rel="stylesheet" href="site-pages.css">
<link rel="stylesheet" href="account.css">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
</head>
<body class="site-page">

<div class="page">

	<header class="topbar">
		<a class="brand-link" href="index.html">
			<span class="brand-mark" aria-hidden="true">
				<svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
					<path d="M3 24c4-3.4 4-7.6 0-11s-4-7.6 0-11" stroke-dasharray="2.4 3.4"/>
					<path d="M17.5 13.5c0 0-4.7-3.2-4.7-6.9 0-2 1.6-3.2 3.2-3.2.7 0 1.3.3 1.5.9.2-.6.8-.9 1.5-.9 1.6 0 3.2 1.2 3.2 3.2 0 3.7-4.7 6.9-4.7 6.9z" fill="currentColor" stroke="none"/>
				</svg>
			</span>
			<span class="brand">Lovingly<em>Lost</em></span>
		</a>
		<button type="button" class="site-menu-btn" id="siteMenuBtn" aria-expanded="false" aria-controls="siteNav">
			<svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h14M3 10h14M3 14h14"/></svg>
			<span>Menu</span>
		</button>
				<nav class="site-nav" id="siteNav" aria-label="Main">
			<a class="site-nav-link" href="index.html">Plan a trip</a>
			<a class="site-nav-link" href="about.html">About</a>
			<a class="site-nav-link" href="contact.html">Contact</a>
			<a class="site-nav-link" href="login.html" id="accountNavLink" aria-current="page">Sign in</a>
		</nav>
	</header>

	<main class="page-main">

		<section class="page-hero">
			<p class="page-eyebrow">Your account</p>
			<h1 class="page-title" id="authTitle">Welcome <em>back.</em></h1>
			<p class="page-lede">Save your trips, keep a list of favorite stops, and skip the places you'd rather not see again.</p>
		</section>

		<section class="page-card account-card">
			<div class="account-tabs" data-show="signin signup">
				<button type="button" class="account-tab is-active" data-mode="signin">Sign in</button>
				<button type="button" class="account-tab" data-mode="signup">Create account</button>
			</div>

			<form class="account-form" id="authForm">
				<label class="account-field" data-show="signup">
					<span>Your name</span>
					<input type="text" id="authName" autocomplete="name" maxlength="60" required>
				</label>
				<label class="account-field" data-show="signin signup forgot">
					<span>Email</span>
					<input type="email" id="authEmail" autocomplete="email" required>
				</label>
				<label class="account-field" data-show="signin signup newpassword">
					<span>Password</span>
					<input type="password" id="authPassword" autocomplete="current-password" minlength="8" required>
					<small class="account-hint" data-show="signup newpassword">At least 8 characters.</small>
				</label>

				<p class="account-message" id="authMessage" role="status"></p>

				<button type="submit" class="page-btn" id="authSubmit">Sign in</button>

				<button type="button" class="account-link" data-show="signin" data-mode="forgot">Forgot your password?</button>
				<button type="button" class="account-link" data-show="forgot" data-mode="signin">Back to sign in</button>
			</form>
		</section>

		<p class="account-note">You don't need an account to plan a trip. <a href="index.html">Start planning</a></p>

	</main>

	<footer class="site-footer">
		Made with &hearts; for long drives &middot; <a href="contact.html">Found a problem? Let us know</a>
	</footer>

</div>

<script src="site-nav.js"></script>
<script src="account/account-nav.js"></script>
<script type="module" src="account/login-page.js"></script>
<script src="ProgressiveWebApp-Register.js"></script>
</body>
</html>
